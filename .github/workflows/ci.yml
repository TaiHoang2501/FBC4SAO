name: CI Pipeline

on:
  push:
    branches: [ "main", "fix/**", "feat/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test Suite & Benchmark Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & API Integration Tests (Isolated from external services)
        run: |
          pytest tests/ -v -m "not external"

      - name: Verify Reproducibility & Mathematical Invariants (CI mode)
        run: |
          python eval/verify_reproducibility.py --ci

  docker-build:
    name: Production Docker Build Verification
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag fbc4sao-rag:${{ github.sha }}
